name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # AUTO-FIX 7: GitHub Release create karne ke liye Write Permission allow karega
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # AUTO-FIX 1: Agar gradlew wrapper repo me missing ho toh khud bana dega
    - name: Ensure Gradle Wrapper exists
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found! Generating a new Gradle wrapper automatically..."
          gradle wrapper
        fi

    # AUTO-FIX 2: AndroidX dependencies ke liye properties enable karega
    - name: Enable AndroidX Properties
      run: |
        touch gradle.properties
        if ! grep -q "android.useAndroidX" gradle.properties; then
          echo "android.useAndroidX=true" >> gradle.properties
        fi
        if ! grep -q "android.enableJetifier" gradle.properties; then
          echo "android.enableJetifier=true" >> gradle.properties
        fi
        echo "gradle.properties updated successfully."

    # AUTO-FIX 3: Manifest merger ke saare issues (exported aur package attribute) ko clean karega
    - name: Auto-Fix AndroidManifest.xml (Robust Parser)
      run: |
        cat << 'EOF' > fix_manifest.py
        import os
        import re

        for root, dirs, files in os.walk('.'):
            for file in files:
                if file == 'AndroidManifest.xml':
                    path = os.path.join(root, file)
                    with open(path, 'r', encoding='utf-8') as f:
                        content = f.read()
                    
                    original = content
                    
                    # <receiver> tag ko scan karke android:exported="true" inject karega
                    receiver_tags = re.findall(r'<receiver[^>]+>', content, re.DOTALL)
                    for tag in receiver_tags:
                        if 'AdminReceiver' in tag and 'android:exported' not in tag:
                            print(f'Fixing missing android:exported in: {path}')
                            if tag.endswith('/>'):
                                fixed_tag = tag[:-2] + ' android:exported="true" />'
                            else:
                                fixed_tag = tag[:-1] + ' android:exported="true">'
                            content = content.replace(tag, fixed_tag)
                    
                    # Old package attribute ko remove karega
                    if 'package=' in content:
                        print(f'Removing deprecated package attribute from manifest tag in: {path}')
                        content = re.sub(r'\bpackage=["\'][^"\']*["\']', '', content)

                    if content != original:
                        with open(path, 'w', encoding='utf-8') as f:
                            f.write(content)
        EOF
        python3 fix_manifest.py

    # AUTO-FIX 4: Agar app icon resources missing hain toh temporary dummy icons create karega
    - name: Auto-Fix Missing App Icons (Placeholders)
      run: |
        mkdir -p app/src/main/res/mipmap
        
        if [ ! -f "app/src/main/res/mipmap/ic_launcher.xml" ] && [ ! -d "app/src/main/res/mipmap-hdpi" ]; then
          echo "ic_launcher missing! Creating placeholder XML icon..."
          cat << 'EOF' > app/src/main/res/mipmap/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.google.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#FF004D40"/>
        </shape>
        EOF
        fi

        if [ ! -f "app/src/main/res/mipmap/ic_launcher_round.xml" ]; then
          echo "ic_launcher_round missing! Creating placeholder round XML icon..."
          cat << 'EOF' > app/src/main/res/mipmap/ic_launcher_round.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.google.com/apk/res/android" android:shape="oval">
            <solid android:color="#FF004D40"/>
        </shape>
        EOF
        fi

    # AUTO-FIX 5: strings.xml me se duplicate admin_description string ko clean karega
    - name: Auto-Fix Duplicate Strings (Clean strings.xml)
      run: |
        cat << 'EOF' > fix_strings.py
        import os
        import re

        for root, dirs, files in os.walk('.'):
            for file in files:
                if file == 'strings.xml':
                    path = os.path.join(root, file)
                    with open(path, 'r', encoding='utf-8') as f:
                        content = f.read()
                    
                    pattern = r'(<string[^>]*name=["\']admin_description["\'][^>]*>.*?</string>)'
                    matches = re.findall(pattern, content, re.DOTALL)
                    
                    if len(matches) > 1:
                        print(f"Found {len(matches)} duplicate entries for 'admin_description' in {path}. Cleaning up...")
                        first_match = matches[0]
                        content = content.replace(first_match, "[[[KEEP_FIRST_ENTRY]]]", 1)
                        content = re.sub(pattern, "", content, flags=re.DOTALL)
                        content = content.replace("[[[KEEP_FIRST_ENTRY]]]", first_match)
                        
                        with open(path, 'w', encoding='utf-8') as f:
                            f.write(content)
        EOF
        python3 fix_strings.py

    # AUTO-FIX 6: Java file ki galat spelling aur Manifest reference ko auto-correct karega
    - name: Auto-Fix Java Filename Typo (BootReciever -> BootReceiver)
      run: |
        find . -name "BootReciever.java" | while read file; do
          dir=$(dirname "$file")
          echo "Fixing Java filename: Renaming $file to $dir/BootReceiver.java"
          mv "$file" "$dir/BootReceiver.java"
        done

        find . -name "AndroidManifest.xml" | while read manifest; do
          if grep -q "BootReciever" "$manifest"; then
            echo "Fixing typos in Manifest: Changing BootReciever to BootReceiver in $manifest"
            sed -i 's/BootReciever/BootReceiver/g' "$manifest"
          fi
        done

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
