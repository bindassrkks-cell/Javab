name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # AUTO-FIX 1: Agar gradlew wrapper repo me missing ho toh khud bana dega
    - name: Ensure Gradle Wrapper exists
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found! Generating a new Gradle wrapper automatically..."
          gradle wrapper
        fi

    # AUTO-FIX 2: AndroidX dependencies ke liye properties enable karega
    - name: Enable AndroidX Properties
      run: |
        touch gradle.properties
        if ! grep -q "android.useAndroidX" gradle.properties; then
          echo "android.useAndroidX=true" >> gradle.properties
        fi
        if ! grep -q "android.enableJetifier" gradle.properties; then
          echo "android.enableJetifier=true" >> gradle.properties
        fi
        echo "gradle.properties updated successfully."

    # AUTO-FIX 3: Manifest me AdminReceiver ke liye missing android:exported add karega
    - name: Auto-Fix AndroidManifest.xml (Missing android:exported)
      run: |
        python3 -c "
        import os
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file == 'AndroidManifest.xml':
                    path = os.path.join(root, file)
                    with open(path, 'r', encoding='utf-8') as f:
                        content = f.read()
                    
                    if 'AdminReceiver' in content and 'android:exported' not in content:
                        print(f'Fixing missing android:exported in: {path}')
                        # Dono conditions check karega: full package name ya relative name (.AdminReceiver)
                        content = content.replace('android:name=\"com.zero.xploid.AdminReceiver\"', 'android:name=\"com.zero.xploid.AdminReceiver\" android:exported=\"true\"')
                        content = content.replace('android:name=\".AdminReceiver\"', 'android:name=\".AdminReceiver\" android:exported=\"true\"')
                        
                        with open(path, 'w', encoding='utf-8') as f:
                            f.write(content)
        "

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
